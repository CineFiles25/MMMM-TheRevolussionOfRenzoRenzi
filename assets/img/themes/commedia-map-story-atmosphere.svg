<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" preserveAspectRatio="none"><defs><radialGradient id="rose"><stop stop-color="#f5a1cb" stop-opacity=".65" /><stop offset="1" stop-color="#f5a1cb" stop-opacity="0" /></radialGradient><radialGradient id="aqua"><stop stop-color="#92e5ef" stop-opacity=".7" /><stop offset="1" stop-color="#92e5ef" stop-opacity="0" /></radialGradient></defs><style>.pink,.blue{animation:spot 11s ease-in-out infinite alternate}.blue{animation-delay:-5s}@keyframes spot{from{transform:translate(-20px,6px);opacity:.35}to{transform:translate(25px,-10px);opacity:.65}}@media(prefers-reduced-motion:reduce){.pink,.blue{animation:none}}</style><ellipse class="pink" cx="200" cy="450" rx="330" ry="200" fill="url(#rose)" /><ellipse class="blue" cx="1000" cy="180" rx="310" ry="190" fill="url(#aqua)" /></svg>