<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item — The Revolussion of Renzo Renzi</title>
  <!--
    This file is a WORKING SKELETON, not the final design.
    It shows how data/items.json, data/narratives.json and js/main.js
    connect: data loading, prev/next, theme switching, the three text
    versions (museum / read more / told by Renzo) with their selector,
    and a real asset preview (image/PDF/video) from assets/items/.

    Layout rule from the brief: the page is exactly as big as the browser
    window and never scrolls as a whole. Only the media box (when it holds
    several images) and the text box scroll, each inside its own area.
    River will replace the colours/typography with the 6 CSS themes; the
    ids used by the script (theme-select, item-view, item-text,
    text-selectors, prev-button, next-button, text-status) must stay.
  -->
  <link rel="stylesheet" href="css/theme-3.css" id="theme-stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }

    header, footer { flex: none; padding: 0.4rem 0.75rem; }
    header { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: center; }
    header select { max-width: calc(100vw - 6.5rem); }
    footer nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; justify-content: space-between; }
    #text-selectors fieldset { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; align-items: center; margin: 0; padding: 0.15rem 0.75rem; }

    main { flex: 1; min-height: 0; }
    .item-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1rem;
                   height: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; }
    .item-media, .item-info { min-height: 0; overflow: auto; }
    .item-media { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; }
    .item-media.multi { justify-content: flex-start; }
    .item-media img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .item-media.multi img { max-height: none; }
    .item-media iframe { width: 100%; height: auto; aspect-ratio: 16 / 9; max-height: 100%; border: 0; }
    .item-context { margin: 0 0 0.5rem; }
    .item-info h1 { margin-top: 0; }

    /* Text for screen readers only (announces the chosen text version). */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
               overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* Phones: media on top (40% of the height), text below, still no page scroll. */
    @media (max-width: 700px) {
      .item-layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 40%) minmax(0, 1fr); gap: 0.5rem; }
      .item-info h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header>
    <nav aria-label="Theme navigation">
      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
    </nav>
    <nav aria-label="Exhibition" id="page-nav"></nav>
  </header>

  <main id="item-view">
    <p id="loading-message">Loading…</p>
  </main>
  <p id="text-status" class="sr-only" role="status" aria-live="polite"></p>

  <footer>
    <nav aria-label="Navigation between items">
      <button id="prev-button" disabled>&larr; Previous</button>
      <div id="text-selectors"></div>
      <button id="next-button" disabled>Next &rarr;</button>
    </nav>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (async function initItemPage() {
      await Exhibition.load();
      Exhibition.applyStoredTheme();
      // Populates the <select>, keeps it in sync with the current theme and
      // swaps the stylesheet on change — shared with every other page via
      // Exhibition.wireThemeSelect() (js/main.js).
      Exhibition.wireThemeSelect(document.getElementById("theme-select"));

      // Current state read from the query string: item.html?narrative=timeline&item=renzi_letter_1942
      const narrativeId = Exhibition.getQueryParam("narrative") || "timeline";
      let itemId = Exhibition.getQueryParam("item");

      // If no item was passed, start from the first one in the narrative.
      if (!itemId) {
        const items = Exhibition.getNarrativeItems(narrativeId);
        itemId = items.length > 0 ? items[0].id : null;
      }

      renderItem(narrativeId, itemId);
      wireNavButtons(narrativeId, itemId);

      // Text-version selector (museum / read more / told by Renzo): only the
      // text box is redrawn, the rest of the page stays as it is.
      Exhibition.wireTextSelector(document.getElementById("text-selectors"), (voiceId) => {
        const item = Exhibition.getItem(itemId);
        const box = document.getElementById("item-text");
        if (!item || !box) return;
        const text = Exhibition.findText(item, { voice: voiceId });
        box.innerHTML = text ? Exhibition.formatText(text.content) : "<p>[text to be written]</p>";
        const voice = Exhibition.getVoices().find((v) => v.id === voiceId);
        document.getElementById("text-status").textContent = `Showing the text version: ${voice ? voice.label : voiceId}.`;
      });

      // Renders the item's media: every local file (<img> for image files, a
      // plain link for anything else such as the PDF) plus every entry of
      // item.externalLinks (an <iframe> embed when the link has an embedUrl,
      // e.g. YouTube; a plain link otherwise). Items with none show a note.
      function renderAsset(item) {
        const parts = [];
        (item.images || []).forEach((path) => {
          const encodedPath = encodeURI(path);
          const isImage = /\.(jpe?g|png|gif|webp)$/i.test(path);
          parts.push(isImage
            ? `<img src="${encodedPath}" alt="${item.title}" class="item-asset">`
            : `<p><a href="${encodedPath}" target="_blank" rel="noopener">Open ${path.split("/").pop()}</a></p>`);
        });
        (item.externalLinks || []).forEach((link) => {
          if (link.embedUrl) {
            parts.push(`<iframe class="item-embed" src="${link.embedUrl}" title="${link.label}" loading="lazy" allowfullscreen></iframe>`);
          } else {
            parts.push(`<p><a href="${link.url}" target="_blank" rel="noopener">${link.label}</a></p>`);
          }
        });
        if (parts.length === 0) {
          return `<p class="asset-missing"><em>[asset not uploaded yet — see item._todo in items.json]</em></p>`;
        }
        return parts.join("\n");
      }

      function renderItem(narrativeId, itemId) {
        const container = document.getElementById("item-view");
        const item = Exhibition.getItem(itemId);

        if (!item) {
          container.innerHTML = "<p>Item not found.</p>";
          return;
        }

        document.title = `${item.title} — The Revolussion of Renzo Renzi`;

        const narrative = Exhibition.getNarrative(narrativeId);
        const order = narrative ? narrative.order : [];
        const stopNo = order.indexOf(item.id) + 1; // 0 if the item is not in this narrative
        const stopLabel = narrative && narrative.stopLabels ? narrative.stopLabels[item.id] : null;
        const room = item.mapPosition ? Exhibition.getRooms().find((r) => r.id === item.mapPosition.area) : null;
        const mapUrl = `map.html?narrative=${encodeURIComponent(narrativeId)}`;

        // "You are here": where this stop sits in the itinerary and in the museum.
        const contextBits = [];
        if (narrative && stopNo > 0) {
          contextBits.push(`${narrative.title} — stop ${stopNo} of ${order.length}${stopLabel ? ` (${stopLabel})` : ""}`);
        }
        if (room) contextBits.push(room.title);

        const text = Exhibition.findText(item); // the visitor's current voice
        const meta = item.metadata || {};
        const assetHtml = renderAsset(item);
        const mediaCount = (item.images || []).length + (item.externalLinks || []).length;

        container.innerHTML = `
          <article class="item-layout">
            <div class="item-media${mediaCount > 1 ? " multi" : ""}" tabindex="0" role="region" aria-label="Media: ${item.title}">
              ${assetHtml}
            </div>
            <div class="item-info" tabindex="0" role="region" aria-label="Text: ${item.title}">
              <p class="item-context">${contextBits.join(" · ")}${contextBits.length ? " · " : ""}<a href="${mapUrl}">See the map</a></p>
              <h1>${item.title}</h1>
              <p><strong>${item.creator || "Unknown creator"}</strong> — ${meta.type || "unknown type"} ${meta.date ? `(${meta.date})` : ""}</p>
              <div class="item-text" id="item-text" lang="en">${text ? Exhibition.formatText(text.content) : "<p>[text to be written — see item.texts in items.json]</p>"}</div>
              ${meta.rights ? `<p class="item-rights"><small>${meta.rights}</small></p>` : ""}
            </div>
          </article>
        `;

        const pageNav = document.getElementById("page-nav");
        if (pageNav) pageNav.innerHTML = `<a href="${mapUrl}">Map</a>`;
      }

      function wireNavButtons(narrativeId, itemId) {
        const prevItem = Exhibition.getPrevItem(narrativeId, itemId);
        const nextItem = Exhibition.getNextItem(narrativeId, itemId);

        const prevBtn = document.getElementById("prev-button");
        const nextBtn = document.getElementById("next-button");

        prevBtn.disabled = !prevItem;
        nextBtn.disabled = !nextItem;

        if (prevItem) {
          prevBtn.onclick = () => {
            window.location.href = Exhibition.buildItemUrl(narrativeId, prevItem.id);
          };
        }
        if (nextItem) {
          nextBtn.onclick = () => {
            window.location.href = Exhibition.buildItemUrl(narrativeId, nextItem.id);
          };
        }
      }
    })();
  </script>
</body>
</html>
