<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item — The Revolussion of Renzo Renzi</title>
  <!--
    This file is a WORKING SKELETON, not the final design.
    It shows how data/items.json, data/narratives.json and js/main.js
    connect: data loading, prev/next, theme switching, the three text
    versions (museum / read more / told by Renzo) with their selector,
    and a real asset preview (image/PDF) from assets/items/.
    River will replace the markup/classes with the real layout and the
    6 CSS themes; the data/id structure underneath can stay.
  -->
  <link rel="stylesheet" href="css/theme-3.css" id="theme-stylesheet">
  <style>
    /* Text for screen readers only (announces the chosen text version). */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
               overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>

  <header>
    <nav aria-label="Theme navigation">
      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
    </nav>
  </header>

  <main id="item-view">
    <p id="loading-message">Loading…</p>
  </main>
  <p id="text-status" class="sr-only" role="status" aria-live="polite"></p>

  <footer>
    <nav aria-label="Navigation between items">
      <button id="prev-button" disabled>&larr; Previous</button>
      <div id="text-selectors"></div>
      <button id="next-button" disabled>Next &rarr;</button>
    </nav>
  </footer>

  <script src="js/main.js"></script>
  <script>
    (async function initItemPage() {
      await Exhibition.load();
      Exhibition.applyStoredTheme();
      // Populates the <select>, keeps it in sync with the current theme and
      // swaps the stylesheet on change — shared with every other page via
      // Exhibition.wireThemeSelect() (js/main.js), instead of duplicating
      // this logic here.
      Exhibition.wireThemeSelect(document.getElementById("theme-select"));

      // Current state read from the query string: item.html?narrative=timeline&item=renzi_letter_1942
      let narrativeId = Exhibition.getQueryParam("narrative") || "timeline";
      let itemId = Exhibition.getQueryParam("item");

      // If no item was passed, start from the first one in the narrative.
      if (!itemId) {
        const items = Exhibition.getNarrativeItems(narrativeId);
        itemId = items.length > 0 ? items[0].id : null;
      }

      renderItem(narrativeId, itemId);
      wireNavButtons(narrativeId, itemId);

      // Text-version selector (museum / read more / told by Renzo): only the
      // text box is redrawn, the rest of the page stays as it is.
      Exhibition.wireTextSelector(document.getElementById("text-selectors"), (voiceId) => {
        const item = Exhibition.getItem(itemId);
        const box = document.getElementById("item-text");
        if (!item || !box) return;
        const text = Exhibition.findText(item, { voice: voiceId });
        box.innerHTML = text ? Exhibition.formatText(text.content) : "<p>[text to be written]</p>";
        const voice = Exhibition.getVoices().find((v) => v.id === voiceId);
        document.getElementById("text-status").textContent = `Showing the text version: ${voice ? voice.label : voiceId}.`;
      });

      // Renders the item's media: the first local asset (<img> for image
      // files, a plain link for anything else such as the PDF) plus every
      // entry of item.externalLinks (an <iframe> embed when the link has an
      // embedUrl, e.g. YouTube; a plain link otherwise). Items with neither
      // show a placeholder note.
      function renderAsset(item) {
        const parts = [];
        if (item.images && item.images.length > 0) {
          const path = item.images[0];
          const encodedPath = encodeURI(path);
          const isImage = /\.(jpe?g|png|gif|webp)$/i.test(path);
          parts.push(isImage
            ? `<img src="${encodedPath}" alt="${item.title}" class="item-asset">`
            : `<p><a href="${encodedPath}" target="_blank" rel="noopener">Open ${path.split("/").pop()}</a></p>`);
        }
        (item.externalLinks || []).forEach((link) => {
          if (link.embedUrl) {
            parts.push(`<iframe class="item-embed" src="${link.embedUrl}" title="${link.label}" width="560" height="315" loading="lazy" allowfullscreen></iframe>`);
          } else {
            parts.push(`<p><a href="${link.url}" target="_blank" rel="noopener">${link.label}</a></p>`);
          }
        });
        if (parts.length === 0) {
          return `<p class="asset-missing"><em>[asset not uploaded yet — see item._todo in items.json]</em></p>`;
        }
        return parts.join("\n");
      }

      function renderItem(narrativeId, itemId) {
        const container = document.getElementById("item-view");
        const item = Exhibition.getItem(itemId);

        if (!item) {
          container.innerHTML = "<p>Item not found.</p>";
          return;
        }

        const text = Exhibition.findText(item); // the visitor's current voice
        const meta = item.metadata || {};

        container.innerHTML = `
          <article>
            <h1>${item.title}</h1>
            <p><strong>${item.creator || "Unknown creator"}</strong> — ${meta.type || "unknown type"} ${meta.date ? `(${meta.date})` : ""}</p>
            ${renderAsset(item)}
            <div class="item-text" id="item-text" lang="en">${text ? Exhibition.formatText(text.content) : "<p>[text to be written — see item.texts in items.json]</p>"}</div>
            ${meta.rights ? `<p class="item-rights"><small>${meta.rights}</small></p>` : ""}
          </article>
        `;
      }

      function wireNavButtons(narrativeId, itemId) {
        const prevItem = Exhibition.getPrevItem(narrativeId, itemId);
        const nextItem = Exhibition.getNextItem(narrativeId, itemId);

        const prevBtn = document.getElementById("prev-button");
        const nextBtn = document.getElementById("next-button");

        prevBtn.disabled = !prevItem;
        nextBtn.disabled = !nextItem;

        if (prevItem) {
          prevBtn.onclick = () => {
            window.location.href = Exhibition.buildItemUrl(narrativeId, prevItem.id);
          };
        }
        if (nextItem) {
          nextBtn.onclick = () => {
            window.location.href = Exhibition.buildItemUrl(narrativeId, nextItem.id);
          };
        }
      }
    })();
  </script>
</body>
</html>
