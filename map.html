<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — The Revolussion of Renzo Renzi</title>
  <!--
    Map page: STRUCTURE ONLY. js/map.js fills the elements listed in
    HTML-IDS.md from data/items.json (positions, rooms) and
    data/narratives.json (itineraries).

    The map is Claudia's final planimetry (assets/img/museum/gallery_planimetry_no_punti.png,
    4032x3024) inside an inline <svg>; the markers and the route are drawn by
    the script into <g id="markers"> and <g id="route">, because there is one
    per item. x/y positions in items.json are PERCENTAGES of the image.
    The viewBox only crops the empty margins of the image for display.

    Accessibility: the map is never the only way in. The side panel lists the
    chosen itinerary as an ordered list of links and every item grouped by room.

    Layout rule from the brief: no global scroll (see css/skeleton.css).
  -->
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/theme-3.css" id="theme-stylesheet">
</head>
<body>

  <header>
    <nav aria-label="Theme">
      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
    </nav>
  </header>

  <div id="map-page">
    <main id="map-stage">
      <svg id="map-svg" role="group" aria-label="Floor plan of the exhibition: one marker per item"
           viewBox="120 830 3770 1840" preserveAspectRatio="xMidYMid meet">
        <image href="assets/img/museum/gallery_planimetry_no_punti.png" x="0" y="0" width="4032" height="3024"></image>
        <g id="route"></g>
        <g id="markers"></g>
      </svg>
    </main>

    <aside id="map-side" aria-labelledby="map-heading">
      <h1 id="map-heading">Exhibition map</h1>

      <fieldset id="itinerary-choice">
        <legend>Choose an itinerary</legend>
      </fieldset>
      <p id="map-status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section id="route-info" aria-labelledby="route-title">
        <h2 id="route-title"></h2>
        <p id="route-title-en"></p>
        <div id="route-description"></div>
        <a id="start-link" href="#">Start this itinerary →</a>
        <ol id="route-stops"></ol>
      </section>

      <h2 id="room-list-heading">All items, by room</h2>
      <div id="room-list"></div>
    </aside>
  </div>

  <script src="js/main.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
