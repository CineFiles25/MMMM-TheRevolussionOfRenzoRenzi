<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — The Revolussion of Renzo Renzi</title>
  <!--
    WORKING SKELETON, not the final design (same disclaimer as item.html).

    The museum map: Claudia's final planimetry of the exhibition space
    (assets/img/museum/gallery_planimetry_no_punti.png, 4032x3024) with one
    clickable marker per item, placed from item.mapPosition in data/items.json.

    NEW: itineraries. The visitor picks a narrative (or "all items"); the stops
    of that narrative are joined by a numbered route in the order given by
    data/narratives.json, the other items are dimmed. Nothing is hard-coded:
    route = narrative.order, positions = mapPosition.

    - mapPosition.x / .y are PERCENTAGES (0-100) of the image width/height.
    - mapPosition.area is a room id listed in items.json -> rooms.
    - The URL keeps the choice: map.html?narrative=bologna-walk (or =all).

    Layout: exactly viewport-sized (project requirement: no global scroll).
    The map is an inline <svg> with a viewBox, so it scales to any box; only
    the side panel scrolls, inside itself.

    Accessibility (the team's #1 priority): the map is never the only way in.
    The side panel gives the itinerary as an ordered list of links and every
    item grouped by room. Markers are real links with a text label, and the
    number of stops is announced when the itinerary changes.

    Colours: the route/marker colour is the CSS variable --map-accent, so a
    theme can override it (e.g. `:root[data-theme="theme-4"] { --map-accent: ... }`).
  -->
  <link rel="stylesheet" href="css/theme-3.css" id="theme-stylesheet">
  <style>
    /* Minimal layout so the page works before River's CSS exists.
       River: safe to override/replace, just keep the ids used by the script. */
    :root { --map-accent: #3a3ac8; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { flex: 0 0 auto; padding: 0.4rem 0.8rem; }
    header select { max-width: calc(100vw - 6.5rem); }  /* long theme names must not widen the page on phones */
    #map-page { flex: 1 1 auto; min-height: 0; display: flex; gap: 0.8rem; padding: 0 0.8rem 0.8rem; }
    #map-stage { flex: 1 1 auto; min-width: 0; min-height: 0; }
    #map-svg { display: block; width: 100%; height: 100%; }
    #map-side { flex: 0 0 22rem; max-width: 40%; overflow-y: auto; }
    #map-side h1 { font-size: 1.2rem; margin: 0 0 0.3rem; }
    #map-side h2 { font-size: 1rem; margin: 0.8rem 0 0.2rem; }
    #map-side ul, #map-side ol { margin: 0; padding-left: 1.4rem; }
    #itinerary-choice { border: 1px solid currentColor; margin: 0.5rem 0; padding: 0.3rem 0.6rem 0.5rem; }
    #itinerary-choice label { display: block; margin: 0.15rem 0; cursor: pointer; }
    #route-info p { margin: 0.2rem 0; }
    #start-link { display: inline-block; margin: 0.3rem 0; font-weight: bold; }
    .room-swatch { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.4em;
                   border: 1px solid currentColor; vertical-align: -0.1em; }
    .route-line { stroke: var(--map-accent); stroke-width: 14; stroke-dasharray: 44 30; stroke-linecap: round;
                  fill: none; opacity: 0.75; }
    .marker-dot { fill: var(--map-accent); stroke: #fff; stroke-width: 8; }
    .marker-num { fill: #fff; font: 700 58px sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .marker.dim { opacity: 0.3; }
    .marker.dim:hover, .marker.dim:focus { opacity: 1; }
    .marker:hover .marker-dot, .marker:focus .marker-dot { fill: #ffb000; stroke: #000; stroke-width: 10; }
    .marker:hover .marker-num, .marker:focus .marker-num { fill: #000; }
    .marker:focus { outline: none; }
    .marker-hit { fill: transparent; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 700px) {
      #map-page { flex-direction: column; }
      #map-stage { flex: 0 0 42%; }
      #map-side { flex: 1 1 auto; max-width: none; }
    }
  </style>
</head>
<body>

  <header>
    <nav aria-label="Theme navigation">
      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
    </nav>
  </header>

  <div id="map-page">
    <main id="map-stage">
      <svg id="map-svg" role="group" aria-label="Floor plan of the exhibition: one marker per item"
           viewBox="120 830 3770 1840" preserveAspectRatio="xMidYMid meet">
        <!-- viewBox = the drawing's bounding box in the 4032x3024 image plus margin;
             purely presentational: x/y percentages in items.json still refer to the whole image. -->
        <image href="assets/img/museum/gallery_planimetry_no_punti.png" x="0" y="0" width="4032" height="3024"></image>
        <g id="route"></g>
        <g id="markers"></g>
      </svg>
    </main>

    <aside id="map-side" aria-labelledby="side-heading">
      <h1 id="side-heading">Exhibition map</h1>
      <fieldset id="itinerary-choice">
        <legend>Choose an itinerary</legend>
      </fieldset>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
      <div id="route-info"></div>
      <h2 id="rooms-heading">All items, by room</h2>
      <div id="item-list"></div>
    </aside>
  </div>

  <script src="js/main.js"></script>
  <script>
    (async function initMapPage() {
      await Exhibition.load();
      Exhibition.applyStoredTheme();
      Exhibition.wireThemeSelect(document.getElementById("theme-select"));

      // Size of the image the percentages refer to (assets/img/museum/gallery_planimetry_no_punti.png)
      const IMG_W = 4032, IMG_H = 3024;
      const SVG_NS = "http://www.w3.org/2000/svg";

      const rooms = Exhibition.getRooms();
      const narratives = Exhibition.getNarratives();
      const items = Exhibition.getAllItems();

      // Which itinerary is shown: ?narrative=<id> | all ; default = the historical timeline
      let selected = Exhibition.getQueryParam("narrative");
      if (selected !== "all" && !Exhibition.getNarrative(selected)) selected = "timeline";

      const isPlaced = (it) => it.mapPosition && typeof it.mapPosition.x === "number" && typeof it.mapPosition.y === "number";
      const roomTitle = (id) => (rooms.find((r) => r.id === id) || {}).title || "";
      const toXY = (it) => [(it.mapPosition.x / 100) * IMG_W, (it.mapPosition.y / 100) * IMG_H];

      buildChoice();
      render();

      /** The narrative to open an item in: the chosen itinerary if it contains the item, otherwise the first one that does. */
      function linkNarrative(item) {
        const chosen = Exhibition.getNarrative(selected);
        if (chosen && chosen.order.includes(item.id)) return chosen.id;
        const other = narratives.find((n) => n.order.includes(item.id));
        return other ? other.id : "timeline";
      }
      function itemUrl(item) {
        return Exhibition.buildItemUrl(linkNarrative(item), item.id);
      }

      function buildChoice() {
        const box = document.getElementById("itinerary-choice");
        const options = narratives.map((n) => ({ id: n.id, label: `${n.title} (${n.order.length} stops)` }));
        options.push({ id: "all", label: "Show all items (no route)" });
        options.forEach((o) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "radio"; input.name = "itinerary"; input.value = o.id; input.checked = o.id === selected;
          input.addEventListener("change", () => {
            selected = o.id;
            history.replaceState(null, "", `?narrative=${encodeURIComponent(selected)}`);
            render();
          });
          label.append(input, document.createTextNode(" " + o.label));
          box.appendChild(label);
        });
      }

      function render() {
        const narrative = Exhibition.getNarrative(selected);           // null for "all"
        const stops = narrative ? narrative.order.map((id) => Exhibition.getItem(id)).filter((it) => it && isPlaced(it)) : [];
        const stopNo = new Map(stops.map((it, i) => [it.id, i + 1]));

        drawRoute(stops);
        drawMarkers(narrative, stopNo);
        renderRouteInfo(narrative, stops);
        renderRoomList();

        document.getElementById("status").textContent = narrative
          ? `Itinerary: ${narrative.title}, ${stops.length} stops.`
          : "Showing all items, no route.";
      }

      function drawRoute(stops) {
        const layer = document.getElementById("route");
        layer.replaceChildren();
        if (stops.length < 2) return;
        const line = document.createElementNS(SVG_NS, "polyline");
        line.setAttribute("class", "route-line");
        line.setAttribute("points", stops.map((it) => toXY(it).join(",")).join(" "));
        line.setAttribute("aria-hidden", "true");
        layer.appendChild(line);
      }

      function drawMarkers(narrative, stopNo) {
        const layer = document.getElementById("markers");
        layer.replaceChildren();
        // Items that are not on the route first, so numbered stops are drawn on top of them
        const ordered = [...items].sort((a, b) => (stopNo.has(a.id) ? 1 : 0) - (stopNo.has(b.id) ? 1 : 0));
        ordered.forEach((item) => {
          if (!isPlaced(item)) return;                                  // listed in the side panel, not on the plan
          const [cx, cy] = toXY(item);
          const n = stopNo.get(item.id);
          const onRoute = n !== undefined;

          const a = document.createElementNS(SVG_NS, "a");
          a.setAttribute("class", "marker" + (narrative && !onRoute ? " dim" : ""));
          a.setAttribute("href", itemUrl(item));
          const where = roomTitle(item.mapPosition.area) || "no room";
          a.setAttribute("aria-label", onRoute
            ? `Stop ${n} of ${stopNo.size}: ${item.title} (${where})`
            : `${item.title} (${where})`);

          const hit = document.createElementNS(SVG_NS, "circle");       // bigger invisible target, easier to click/tap
          hit.setAttribute("class", "marker-hit");
          hit.setAttribute("cx", cx); hit.setAttribute("cy", cy); hit.setAttribute("r", 85);
          const dot = document.createElementNS(SVG_NS, "circle");
          dot.setAttribute("class", "marker-dot");
          dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("r", onRoute ? 56 : 42);
          const title = document.createElementNS(SVG_NS, "title");      // native tooltip
          title.textContent = onRoute ? `${n}. ${item.title}` : item.title;
          a.append(hit, dot, title);

          if (onRoute) {
            const num = document.createElementNS(SVG_NS, "text");
            num.setAttribute("class", "marker-num");
            num.setAttribute("x", cx); num.setAttribute("y", cy);
            num.setAttribute("aria-hidden", "true");
            num.textContent = String(n);
            a.appendChild(num);
          }
          layer.appendChild(a);
        });
      }

      /** Side panel, top: the chosen itinerary as an ordered list of links (the text version of the route). */
      function renderRouteInfo(narrative, stops) {
        const host = document.getElementById("route-info");
        host.replaceChildren();
        if (!narrative) return;

        const h2 = document.createElement("h2");
        h2.textContent = narrative.title;
        host.appendChild(h2);
        if (narrative.titleEn) host.appendChild(para(narrative.titleEn, true));
        if (narrative.description) host.appendChild(para(narrative.description));

        if (stops.length) {
          const start = document.createElement("a");
          start.id = "start-link";
          start.href = Exhibition.buildItemUrl(narrative.id, stops[0].id);
          start.textContent = "Start this itinerary →";
          host.appendChild(start);

          const ol = document.createElement("ol");
          stops.forEach((it) => {
            const li = document.createElement("li");
            const link = document.createElement("a");
            link.href = Exhibition.buildItemUrl(narrative.id, it.id);
            link.textContent = it.title;
            li.appendChild(link);
            ol.appendChild(li);
          });
          host.appendChild(ol);
        }
      }
      function para(text, italic) {
        const p = document.createElement("p");
        p.textContent = text;
        if (italic) p.style.fontStyle = "italic";
        return p;
      }

      /** Side panel, bottom: every item grouped by room (items without a position go last, flagged). */
      function renderRoomList() {
        const host = document.getElementById("item-list");
        host.replaceChildren();
        rooms.forEach((room) => {
          const list = items.filter((i) => i.mapPosition && i.mapPosition.area === room.id);
          if (list.length) host.appendChild(buildSection(room.title, list, room.color, room.theme));
        });
        const unplaced = items.filter((i) => !isPlaced(i));
        if (unplaced.length) host.appendChild(buildSection("Not yet placed on the map", unplaced));
      }

      function buildSection(title, list, color, subtitle) {
        const section = document.createElement("section");
        const h3 = document.createElement("h3");
        h3.style.fontSize = "0.95rem"; h3.style.margin = "0.6rem 0 0.1rem";
        if (color) {
          const sw = document.createElement("span");
          sw.className = "room-swatch"; sw.style.background = color; sw.setAttribute("aria-hidden", "true");
          h3.appendChild(sw);
        }
        h3.appendChild(document.createTextNode(title));
        section.appendChild(h3);
        if (subtitle) section.appendChild(para(subtitle));
        const ul = document.createElement("ul");
        list.forEach((item) => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = itemUrl(item);
          link.textContent = item.title;
          li.appendChild(link);
          ul.appendChild(li);
        });
        section.appendChild(ul);
        return section;
      }
    })();
  </script>
</body>
</html>
