<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item — The Revolussion of Renzo Renzi</title>
  <!--
    Item page: STRUCTURE ONLY. Every piece of content (title, text, image...)
    comes from data/items.json and is put into the element with the id listed
    in HTML-IDS.md by js/item.js. The page is written here, the data lives in
    the JSON, the logic lives in the JS.

    Layout rule from the brief: the page is exactly as big as the browser
    window and never scrolls as a whole (see css/skeleton.css).
  -->
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/film-strip.css">
  <link rel="stylesheet" href="css/theme-3.css" id="theme-stylesheet">
</head>
<body>

  <header>
    <nav aria-label="Theme">
      <label for="theme-select">Theme:</label>
      <select id="theme-select"></select>
    </nav>
  </header>

  <main id="item-main">
    <article id="item-layout">
      <div id="item-media" tabindex="0" role="region" aria-label="Media"></div>
      <div id="item-info" tabindex="0" role="region" aria-label="Text">
        <p id="item-context"></p>
        <div id="item-room-intro" hidden></div>
        <p><a id="item-map-link" href="map.html">See the map</a></p>
        <h1 id="item-title">Loading…</h1>
        <p><strong id="item-creator"></strong> — <span id="item-type"></span> <span id="item-date"></span></p>
        <div id="item-text" lang="en"></div>
        <p id="item-next-room" hidden></p>
        <p id="item-rights"></p>
      </div>
    </article>
  </main>

  <nav id="narrative-strip" class="film-strip" aria-label="Objects in this narrative" hidden></nav>

  <p id="text-status" class="sr-only" role="status" aria-live="polite"></p>

  <footer>
    <nav aria-label="Navigation between items">
      <button id="prev-button" disabled>&larr; Previous</button>
      <fieldset id="text-selector">
        <legend>Text version</legend>
        <label title="A short introduction for a general audience"><input type="radio" name="text-voice" id="voice-museum" value="museum"> Read less</label>
        <label title="A longer, archival account with catalogue details"><input type="radio" name="text-voice" id="voice-archival" value="archival"> Read more</label>
        <label title="A brief, playful voice for younger visitors"><input type="radio" name="text-voice" id="voice-renzo" value="renzo"> Told by Renzo</label>
      </fieldset>
      <button id="next-button" disabled>Next &rarr;</button>
    </nav>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/item.js"></script>
  <script>
    (async function () {
      await Exhibition.load();
      var strip = document.getElementById("narrative-strip");
      var narrativeId = Exhibition.getQueryParam("narrative");
      var currentId = Exhibition.getQueryParam("item");
      if (!Exhibition.getNarrative(narrativeId)) return;
      var IMAGE_FILE = /\.(jpe?g|png|gif|webp)$/i;

      Exhibition.getNarrativeItems(narrativeId).forEach(function (item) {
        var video = (item.externalLinks || []).find(function (link) { return link.embedUrl; });
        var image = (item.images || []).find(function (file) { return IMAGE_FILE.test(file); });
        var href = Exhibition.buildItemUrl(narrativeId, item.id);
        var frame;

        if (video) {
          frame = document.createElement("div");
          frame.className = "frame video";
          var iframe = document.createElement("iframe");
          iframe.src = video.embedUrl;
          iframe.title = video.label;
          iframe.loading = "lazy";
          iframe.allowFullscreen = true;
          frame.appendChild(iframe);
          var caption = document.createElement("a");
          caption.href = href;
          caption.textContent = item.title;
          frame.appendChild(caption);
        } else {
          frame = document.createElement("a");
          frame.className = "frame";
          frame.href = href;
          if (image) {
            var img = document.createElement("img");
            img.src = image;
            img.alt = item.title;
            frame.appendChild(img);
          } else {
            var empty = document.createElement("span");
            empty.className = "empty";
            empty.textContent = "Image coming soon";
            frame.appendChild(empty);
          }
          var label = document.createElement("span");
          label.textContent = item.title;
          frame.appendChild(label);
        }

        if (item.id === currentId) frame.setAttribute("aria-current", "true");
        strip.appendChild(frame);
      });

      var narratives = Exhibition.getNarratives();
      var next = narratives[(narratives.findIndex(function (n) { return n.id === narrativeId; }) + 1) % narratives.length];
      var end = document.createElement("div");
      end.className = "frame end";
      var endText = document.createElement("span");
      endText.textContent = "End of this narrative";
      end.appendChild(endText);
      if (next && next.id !== narrativeId) {
        var nextLink = document.createElement("a");
        nextLink.href = Exhibition.buildItemUrl(next.id, next.order[0]);
        nextLink.textContent = "Next: " + next.title;
        end.appendChild(nextLink);
      }
      strip.appendChild(end);

      strip.hidden = false;
    })();
  </script>

</body>
</html>
